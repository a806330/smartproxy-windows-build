name: 构建 SmartProxy Windows 版

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '官方仓库的标签或分支'
        required: false
        default: 'v2.9.3'
  push:
    branches: [main]
    paths: ['.github/workflows/build-windows.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 取 SmartProxy 官方源码
        uses: actions/checkout@v4
        with:
          repository: yiguihai11/SmartProxy
          ref: ${{ github.event.inputs.ref || 'v2.9.3' }}
          fetch-depth: 1

      - name: 安装 Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: 应用本地回环上游补丁
        run: |
          set -e
          python3 patch_loopback.py
          grep -n "LOCAL_LOOPBACK_PATCH" internal/upstream/proxy.go

      - name: 交叉编译 windows amd64
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -e
          go version
          echo "== 方案1: 最小标签 with_gvisor（官方 CI 已验证可编译）=="
          if go build -tags with_gvisor -trimpath -ldflags "-s -w" -o smartproxy-windows-amd64.exe ./cmd/smartproxy 2> build1.err; then
            echo "BUILD_OK=plan1"
          else
            echo "== 方案1 失败，输出错误 =="
            cat build1.err
            echo "== 方案2: 官方完整标签去掉需要 CGO 的 lwip =="
            if go build -tags with_gvisor,with_quic,with_utls,with_wireguard -trimpath -ldflags "-s -w" -o smartproxy-windows-amd64.exe ./cmd/smartproxy 2> build2.err; then
              echo "BUILD_OK=plan2"
            else
              echo "== 方案2 失败，输出错误 =="
              cat build2.err
              echo "== 方案3: 不带任何标签 =="
              go build -trimpath -ldflags "-s -w" -o smartproxy-windows-amd64.exe ./cmd/smartproxy
              echo "BUILD_OK=plan3"
            fi
          fi
          echo "== 产物校验 =="
          ls -lh smartproxy-windows-amd64.exe
          file smartproxy-windows-amd64.exe
          sha256sum smartproxy-windows-amd64.exe

      - name: 上传编译产物（备用通道）
        uses: actions/upload-artifact@v4
        with:
          name: smartproxy-windows-amd64
          path: smartproxy-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

      - name: 发布为 Release 资产（主下载通道）
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="win-build-2-patched"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" smartproxy-windows-amd64.exe --clobber
          else
            gh release create "$TAG" smartproxy-windows-amd64.exe \
              --title "SmartProxy Windows amd64 (patched)" \
              --notes "由 GitHub Actions 从官方源码交叉编译：本地回环上游跳过 CN 出口误判，仅用于本机验证"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
